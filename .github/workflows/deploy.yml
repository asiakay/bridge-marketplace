name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Deploy Worker API ──────────────────────────────────────────────────────
  deploy-api:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply bridge-marketplace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets are stored in Cloudflare and persist across deploys.
      # This step re-sets them from GitHub secrets every deploy so that
      # rotating a secret in GitHub automatically rotates it in Cloudflare.
      - name: Sync Worker secrets
        run: |
          echo "$JWT_SECRET"               | npx wrangler secret put JWT_SECRET
          echo "$TWILIO_ACCOUNT_SID"       | npx wrangler secret put TWILIO_ACCOUNT_SID
          echo "$TWILIO_AUTH_TOKEN"        | npx wrangler secret put TWILIO_AUTH_TOKEN
          echo "$TWILIO_PHONE_NUMBER"      | npx wrangler secret put TWILIO_PHONE_NUMBER
          echo "$SHIPPO_API_KEY"           | npx wrangler secret put SHIPPO_API_KEY
          echo "$SHIPPO_WEBHOOK_SECRET"    | npx wrangler secret put SHIPPO_WEBHOOK_SECRET
          echo "$STRIPE_SECRET_KEY"        | npx wrangler secret put STRIPE_SECRET_KEY
          echo "$STRIPE_CONNECT_CLIENT_ID" | npx wrangler secret put STRIPE_CONNECT_CLIENT_ID
          echo "$STRIPE_WEBHOOK_SECRET"    | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          echo "$STRIPE_PLATFORM_FEE_PERCENT" | npx wrangler secret put STRIPE_PLATFORM_FEE_PERCENT
          echo "$PLATFORM_RETURN_ADDRESS_NAME"    | npx wrangler secret put PLATFORM_RETURN_ADDRESS_NAME
          echo "$PLATFORM_RETURN_ADDRESS_STREET1" | npx wrangler secret put PLATFORM_RETURN_ADDRESS_STREET1
          echo "$PLATFORM_RETURN_ADDRESS_CITY"    | npx wrangler secret put PLATFORM_RETURN_ADDRESS_CITY
          echo "$PLATFORM_RETURN_ADDRESS_STATE"   | npx wrangler secret put PLATFORM_RETURN_ADDRESS_STATE
          echo "$PLATFORM_RETURN_ADDRESS_ZIP"     | npx wrangler secret put PLATFORM_RETURN_ADDRESS_ZIP
          echo "$PLATFORM_RETURN_ADDRESS_COUNTRY" | npx wrangler secret put PLATFORM_RETURN_ADDRESS_COUNTRY
          echo "$PLATFORM_RETURN_ADDRESS_PHONE"   | npx wrangler secret put PLATFORM_RETURN_ADDRESS_PHONE
          echo "$PLATFORM_RETURN_ADDRESS_EMAIL"   | npx wrangler secret put PLATFORM_RETURN_ADDRESS_EMAIL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET:               ${{ secrets.JWT_SECRET }}
          TWILIO_ACCOUNT_SID:       ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:        ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER:      ${{ secrets.TWILIO_PHONE_NUMBER }}
          SHIPPO_API_KEY:           ${{ secrets.SHIPPO_API_KEY }}
          SHIPPO_WEBHOOK_SECRET:    ${{ secrets.SHIPPO_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY:        ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_CONNECT_CLIENT_ID: ${{ secrets.STRIPE_CONNECT_CLIENT_ID }}
          STRIPE_WEBHOOK_SECRET:    ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PLATFORM_FEE_PERCENT: ${{ secrets.STRIPE_PLATFORM_FEE_PERCENT }}
          PLATFORM_RETURN_ADDRESS_NAME:    ${{ secrets.PLATFORM_RETURN_ADDRESS_NAME }}
          PLATFORM_RETURN_ADDRESS_STREET1: ${{ secrets.PLATFORM_RETURN_ADDRESS_STREET1 }}
          PLATFORM_RETURN_ADDRESS_CITY:    ${{ secrets.PLATFORM_RETURN_ADDRESS_CITY }}
          PLATFORM_RETURN_ADDRESS_STATE:   ${{ secrets.PLATFORM_RETURN_ADDRESS_STATE }}
          PLATFORM_RETURN_ADDRESS_ZIP:     ${{ secrets.PLATFORM_RETURN_ADDRESS_ZIP }}
          PLATFORM_RETURN_ADDRESS_COUNTRY: ${{ secrets.PLATFORM_RETURN_ADDRESS_COUNTRY }}
          PLATFORM_RETURN_ADDRESS_PHONE:   ${{ secrets.PLATFORM_RETURN_ADDRESS_PHONE }}
          PLATFORM_RETURN_ADDRESS_EMAIL:   ${{ secrets.PLATFORM_RETURN_ADDRESS_EMAIL }}

  # ── Deploy Pages Frontend ──────────────────────────────────────────────────
  deploy-web:
    name: Deploy Pages Frontend
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: cd web && npm run build
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Create Pages project (idempotent — no-ops if already exists)
        run: npx wrangler pages project create bridge-marketplace-web --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy web/dist --project-name bridge-marketplace-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
