name = "bridge-marketplace-api"
main = "api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "bridge-marketplace"
database_id = "TO_BE_FILLED_AFTER_wrangler_d1_create"
migrations_dir = "migrations"

# R2 bucket for listing images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "bridge-marketplace-images"

# Non-secret vars (secrets go in .dev.vars locally, Worker secrets in prod)
[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"
DISPUTE_WINDOW_HOURS = "48"

# Cron trigger: release eligible payouts every hour
[[triggers.crons]]
cron = "0 * * * *"
