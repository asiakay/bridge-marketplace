name = "bridge-marketplace-api"
main = "api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "bridge-marketplace"
database_id = "1b723e7e-d695-4cd9-9a16-06a939075075"
migrations_dir = "migrations"

# R2 bucket for listing images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "bridge-marketplace-images"

# Non-secret vars (secrets go in .dev.vars locally, Worker secrets in prod)
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://bridge-marketplace-web.pages.dev"
DISPUTE_WINDOW_HOURS = "48"

# Cron trigger: release eligible payouts every hour
[triggers]
crons = ["0 * * * *"]
